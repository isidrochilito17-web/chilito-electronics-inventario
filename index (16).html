<style>
:root{--nw:#e3eeff;--rc:#e4f6e8;--bg:#f3f5fa;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dde3ee;--pr:#0f5b45;--ac:#e8a317;--rd:#d93a3a;--gr:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--nw:#1d2c45;--rc:#1d3a2b;--bg:#10151c;--card:#1a212b;--tx:#e9eef5;--mu:#93a0b3;--bd:#2b3544;--pr:#2bb384}}
:root[data-theme="dark"]{--nw:#1d2c45;--rc:#1d3a2b;--bg:#10151c;--card:#1a212b;--tx:#e9eef5;--mu:#93a0b3;--bd:#2b3544;--pr:#2bb384}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--mu);margin:0 0 16px}
h2{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;padding:10px}.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:14px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:700;color:#fff;cursor:pointer}
.buy{background:var(--pr)}.sell{background:var(--ac);color:#241a00}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font-family:inherit;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--pr);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.btn.o{background:var(--ac);color:#241a00}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item small{color:var(--mu);display:block}
.badge{white-space:nowrap;border-radius:20px;padding:4px 10px;font-weight:700;font-size:14px;color:#fff}
.b0{background:#333}.b1{background:var(--rd)}.b2{background:#e98a15}.b3{background:var(--gr)}
.msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-weight:600}
.err{background:#fde8e8;color:#9b1c1c}.ok{background:#e1f5e9;color:#146c3a}
.empty{text-align:center;color:var(--mu);padding:24px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;font-size:13px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.tag{font-weight:700}.c{color:var(--pr)}.v{color:#c07a00}
@media print{body.pl>:not(main){display:none!important}body.pl{background:#fff;padding:0}body.pl main{padding:0;max-width:none}body.pl #app>:not(#psheet){display:none!important}body.pl #psheet,body.pl #psheet *{color:#000!important}body.pl #psheet .card{background:#fff!important;border-color:#bbb!important}}
</style></head><body><main id="app"></main>

'Capacitor':[['Tipo','sel',['Electrolítico','Cerámico','Poliéster','Tántalo','Cerámico SMD','Tántalo SMD','Electrolítico SMD']],['Valor','num'],['Unidad','sel',['pF','nF','µF']],['Voltaje','sel',['6.3 V','10 V','16 V','25 V','35 V','50 V','63 V','100 V','160 V','200 V','250 V','350 V','400 V','450 V','500 V','630 V','1000 V','Otro…']],['Tolerancia','sel',['5%','10%','20%']],['Color del cuerpo','sel',['Negro','Azul oscuro','Azul claro','Verde','Café (zapote)','Rojo','Morado','Gris','']]],

'Puente de diodos':[['Montaje','sel',['THT (agujero pasante)','SMD']],['Referencia','txt'],['Corriente','sel',['','0.5 A','1 A','1.5 A','2 A','3 A','4 A','6 A','8 A','10 A','15 A','25 A']],['Voltaje','sel',['','100 V','200 V','400 V','600 V','800 V','1000 V']]],
'Transistor':[['Tipo','sel',['NPN','PNP','MOSFET canal N','MOSFET canal P']],['Referencia','txt'],['Patas','sel',['','E B C','E C B','B C E','B E C','C B E','C E B','G D S','G S D','D G S','D S G','S G D','S D G']],['Encapsulado','sel',['','TO-92','TO-126','TO-220','TO-220F','TO-247 / TO-3P','TO-3','TO-39 / TO-18','SOT-23 (SMD)','SOT-323 (SMD)','SOT-89 (SMD)','SOT-223 (SMD)','SOT-363 (SMD)','TO-252 DPAK (SMD)','TO-263 D2PAK (SMD)','SO-8 (SMD)']],['Código marcado','txt','opt']],
'Integrado':[['Referencia','txt'],['Pines','sel',['3 pines','4 pines','5 pines','6 pines','8 pines','14 pines','16 pines','18 pines','20 pines','24 pines','28 pines','32 pines','40 pines','44 pines']],['Encapsulado','sel',['','DIP (con patas)','SOIC / SO (SMD)','TSSOP / SSOP (SMD)','SOT-23-5 / SOT-23-6 (SMD)','SOT-89 (SMD)','SOT-223 (SMD)','TO-92','TO-220','TO-252 DPAK (SMD)','TO-263 D2PAK (SMD)','QFP / TQFP (SMD)','QFN (SMD)']],['Código marcado','txt','opt']],
'Potenciómetro':[['Valor','num'],['Unidad','sel',['Ω','kΩ','MΩ']],['Tipo','sel',['Lineal','Logarítmico','Trimmer','Trimmer multivueltas']],['Pines','sel',['3 pines','6 pines']]],
'Interruptor':[['Tipo','txt']],
'Conector':[['Tipo','txt']],
'Módulo':[['Nombre','txt']],
'Sensor':[['Nombre','txt']],
'Relé':[['Voltaje bobina','sel',['3 V','5 V','12 V','24 V','110 V','220 V']],['Tipo','sel',['Mecánico','Estado sólido']],['Referencia','txt','opt']],
'Microcontrolador':[['Referencia','txt'],['Pines','sel',['8 pines','14 pines','20 pines','28 pines','32 pines','40 pines','44 pines','64 pines']]],
'Regulador de voltaje':[['Referencia','txt'],['Patas','sel',['','IN GND OUT','OUT GND IN','GND IN OUT','GND OUT IN','ADJ OUT IN','ADJ IN OUT','IN OUT GND']],['Encapsulado','sel',['','TO-92','TO-220','TO-220F','SOT-89 (SMD)','SOT-223 (SMD)','SOT-23 (SMD)','SO-8 (SMD)','TO-252 DPAK (SMD)','TO-263 D2PAK (SMD)']],['Código marcado','txt','opt']],
'Optoacoplador':[['Referencia','txt'],['Pines','sel',['4 pines','6 pines','8 pines']],['Encapsulado','sel',['','DIP (con patas)','SOIC / SO (SMD)']],['Color','sel',['Blanco','Negro']],['Código marcado','txt','opt']],
'Tiristor / Triac':[['Tipo','sel',['SCR','Triac','Diac']],['Referencia','txt'],['Voltaje','sel',['','100 V','200 V','400 V','600 V','800 V','1000 V']],['Patas','sel',['','K A G','K G A','A K G','A G K','G A K','G K A','MT1 MT2 G','MT2 MT1 G','G MT2 MT1','G MT1 MT2','MT1 G MT2','MT2 G MT1']]],
'Inductor / Bobina':[['Valor','num'],['Unidad','sel',['nH','µH','mH','H']]],
'Transformador':[['Especificación','txt']],
'Fusible':[['Corriente','sel',['0.25 A','0.5 A','1 A','2 A','3 A','5 A','8 A','10 A','15 A','20 A','25 A','30 A']],['Voltaje','sel',['12 V','24 V','32 V','125 V','250 V','500 V']],['Tipo','sel',['Vidrio','Cerámico','Automotriz']]],
'Cristal':[['Frecuencia','txt']],
'Display':[['Tipo','sel',['7 segmentos','LCD 16x2','OLED','Matriz LED']],['Detalle','txt','opt']],
'Buzzer':[['Tipo','sel',['Activo','Pasivo']],['Voltaje','sel',['3 V','5 V','12 V']]],
'Motor':[['Tipo','sel',['DC','Motorreductor','Motorreductor doble eje','Paso a paso','Servo','Ventilador','Driver de motor']],['Referencia','txt','opt'],['Voltaje','txt','opt']],
'Batería':[['Tipo','txt'],['Voltaje','txt','opt']],
'Pulsador':[['Tamaño','sel',['6x6 mm','12x12 mm','Industrial']]],
'Termistor':[['Tipo','sel',['NTC','PTC','LDR']],['Valor','txt','opt']],
'Zócalo':[['Pines','sel',['8','14','16','20','28','40']]],
'Cable':[['Tipo','txt']],
'Otros':[['Nombre','txt']]};
var ICON={Resistencia:'🔩','Resistencia de potencia':'🔥',Capacitor:'🔋',LED:'💡',Diodo:'⚡','Puente de diodos':'🔶',Transistor:'🔧',Integrado:'🧠',Potenciómetro:'🎛️',Interruptor:'🔘',Conector:'🔗',Otros:'📦','Módulo':'🧩',Sensor:'📡','Relé':'🔌',Microcontrolador:'🖥️','Regulador de voltaje':'🔋','Optoacoplador':'🔆','Tiristor / Triac':'⚡','Inductor / Bobina':'🌀',Transformador:'🧲',Fusible:'🧯',Cristal:'💎',Display:'📟',Buzzer:'🔔',Motor:'⚙️','Batería':'🔋',Pulsador:'🔘',Termistor:'🌡️','Zócalo':'🔲',Cable:'🪢'};
var S={items:[],moves:[]},view='home',msg=null,editId=null,act=null,bid=null;
try{var raw=localStorage.getItem('chilito_v1');if(raw){var p=JSON.parse(raw);if(p&&p.items&&p.moves)S=p}}catch(e){}
function migrate(){S.items.forEach(function(i){if(!i.f)return;var ch=false;
 if((i.type==='Transistor'||i.type==='Diodo')&&i.f.Encapsulado===undefined){i.f.Encapsulado='';ch=true}
 if(i.type==='Transistor'&&i.f['Código marcado']===undefined){i.f['Código marcado']='';ch=true}
 if((i.type==='Integrado'||i.type==='Regulador de voltaje'||i.type==='Optoacoplador')&&i.f.Encapsulado===undefined){i.f.Encapsulado='';ch=true}
 if((i.type==='Integrado'||i.type==='Regulador de voltaje'||i.type==='Optoacoplador')&&i.f['Código marcado']===undefined){i.f['Código marcado']='';ch=true}
 if(ch)i.key=(i.cond==='Recuperado'?'R|':'')+i.type+'|'+JSON.stringify(i.f).toLowerCase()})}
migrate();
function save(){try{localStorage.setItem('chilito_v1',JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar: memoria llena. Usa fotos más pequeñas o borra algunas.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function money(n){return '$'+Number(n||0).toLocaleString('es-CO')}
function label(it){var b=it.type==='Otros'?it.f.Nombre:it.type+' '+Object.keys(it.f).filter(function(k){return !/^(Marcado|Banda |Texto|Pata )/.test(k)}).map(function(k){return it.f[k]}).filter(function(v){return v&&v!=='Automático'}).join(' ');return it.cond==='Recuperado'?b+' (Recuperado)':b}
function badge(q){var c=q<=0?['b0','Agotado']:q<=2?['b1','Muy pocos']:q<=5?['b2','Pocos']:['b3','Bien'];return '<span class="badge '+c[0]+'">'+c[1]+' · '+q+'</span>'}
function go(v){view=v;msg=null;act=null;window._x=null;if(v!=='buy'){window._rec=0;window._keepType=null;window._keepCond=null}if(v!=='sell')cart=[];window._q='';window._h='';render()}
function grpKey(i){return i.type==='Resistencia'&&i.f.Material?i.type+' · '+i.f.Material:i.type==='Resistencia de potencia'&&i.f.Tipo?i.type+' · '+i.f.Tipo:i.type}
function openGroup(k){window._q=k.replace(' · ',' ').replace(/[\/]/g,' ').replace(/\s+/g,' ');view='inv';msg=null;render();window.scrollTo(0,0)}
function render(){
 var h='<div style="text-align:center"><img src="'+LOGO+'" alt="Chilito Electronics" style="width:220px;max-width:70%;border-radius:12px;background:#fff"></div><p class="sub">Inventario de componentes electrónicos</p>';
 if(view==='home')h+=home()+tools();else if(view==='buy')h+=form('buy');else if(view==='sell')h+=form('sell');else if(view==='inv')h+=inv();else if(view==='low')h+=low();else if(view==='ord')h+=ordList();else if(view==='calc')h+=calcView();else if(view==='calcs')h+=calcsView();else if(view==='rec')h+=recView();else if(view==='shop')h+=shopView();else if(view==='rep')h+=repView();else if(view==='gan')h+=ganView();else if(view==='neword')h+=ordForm();else if(view==='ordv')h+=ordView();else if(view==='boxes')h+=boxesView();else h+=hist();
 $('app').innerHTML=h;
 var N=[['home','🏠','Inicio'],['inv','🗄️','Inventario'],['ord','🧾','Órdenes'],['hist','🕘','Historial']];
 $('nav').innerHTML=N.map(function(n){return '<button class="'+((view===n[0]||(n[0]==='ord'&&(view==='neword'||view==='ordv')))?'on':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('');
 if(view==='buy'){if(window._keepType&&$('type'))$('type').value=window._keepType;drawFields();if(window._rec&&$('cond'))$('cond').value='Recuperado';if(window._keepCond&&$('cond'))$('cond').value=window._keepCond;togglePrice()}
 if(view==='sell'&&$('sid')){fillSel();toggleSell();drawCart()}
 if(view==='neword')fillPs();
}
function home(){
 var tot=0,by={};S.items.forEach(function(i){tot+=i.qty;var k=grpKey(i);by[k]=(by[k]||0)+i.qty});
 var spent=0,earn=0;S.moves.forEach(function(m){if(m.kind==='compra')spent+=m.qty*m.price;else earn+=m.qty*m.price});(S.orders||[]).forEach(function(o){earn+=(o.vd||0)+(o.vr||0)});
 var low=S.items.filter(function(i){return i.qty<=5}).length;
 var h='<button class="big buy" onclick="go(\'buy\')">🛒 COMPRA</button><div style="height:10px"></div><button class="big sell" onclick="go(\'sell\')">💰 VENTA</button><div style="height:10px"></div><button class="big" style="background:#5b3fb5" onclick="window._bx=null;go(\'boxes\')">📦 CAJAS</button><div style="height:16px"></div>';
 h+='<div class="card"><h2>📊 Resumen</h2><small style="color:var(--mu)">Toca un grupo para ver sus componentes</small><div class="grid"><div class="card stat"><b>'+tot+'</b><span>Componentes</span></div><div class="card stat"><b>'+S.items.length+'</b><span>Referencias</span></div>';
 Object.keys(by).sort().forEach(function(t){h+='<div class="card stat" style="cursor:pointer" onclick="openGroup(\''+t+'\')"><span>'+ICON[t.split(' · ')[0]]+' '+t+'</span><b>'+by[t]+'</b></div>'});
 h+='</div></div><div class="card"><div class="grid"><div class="stat"><span>Gastado</span><b class="c" style="font-size:20px">'+money(spent)+'</b></div><div class="stat"><span>Vendido</span><b class="v" style="font-size:20px">'+money(earn)+'</b></div></div></div>';
 h+='<div class="card"><b>🚨 Alertas</b><br>⚫ Agotado: 0 · 🔴 Muy pocos: 1–2 · 🟠 Pocos: 3–5 · 🟢 Bien: más de 5<br><b>'+low+' referencia(s) con stock bajo o agotado</b><button class="btn o" onclick="go(\'low\')">🚨 Ver alertas</button></div>';
 return h}
function fieldHTML(f){
 var id='f_'+f[0];
 if(f[1]==='sel'){var hasO=f[2].indexOf('Otro…')>=0;return '<div><label>'+f[0]+'</label><select id="'+id+'"'+(hasO?' onchange="var o=document.getElementById(\'o_'+id+'\');if(o){o.style.display=this.value===\'Otro…\'?\'block\':\'none\'}"':'')+'>'+f[2].map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select>'+(hasO?'<input id="o_'+id+'" type="text" inputmode="decimal" placeholder="Escribe el voltaje. Ej: 400" style="display:none;margin-top:6px">':'')+'</div>'}
 return '<div><label>'+f[0]+'</label><input id="'+id+'" '+(f[1]==='num'?'type="number" step="any" inputmode="decimal"':'type="text"')+' placeholder="'+(f[0]==='Nombre'?'Ej: Sensor de temperatura':'')+'"></div>'}
function norm(s){s=String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[µμ]/g,'u');
 s=s.replace(/(\d),(\d)/g,'$1.$2').replace(/kilo\s*ohm\w*/g,'k').replace(/micro\s*faradi\w*/g,'uf').replace(/nano\s*faradi\w*/g,'nf').replace(/pico\s*faradi\w*/g,'pf').replace(/ohm\w*|ω/g,'').replace(/[(),]/g,' ');
 s=s.replace(/(\d)\s+([a-z])/g,'$1$2');
 var w=s.split(/\s+/).filter(Boolean),x=[];
 w.forEach(function(a){if(/^\d[\d.]*(uf|nf|pf|uh|nh)$/.test(a))x.push(a.slice(0,-1))});
 return w.concat(x)}
function match(it,q){var qt=norm(q);if(!qt.length)return true;var w=norm(label(it)+' '+(it.orig||'')+' '+it.type+(S.cajas?' caja '+(it.box||'')+' cajon '+(it.drw||''):''));
 return qt.every(function(t){return w.some(function(a){return /\d/.test(t)?a===t:a.indexOf(t)===0})})}
function fillSel(){var q=val('sq'),av=S.items.filter(function(i){return i.qty>0&&match(i,q)}).sort(cmpItems);
 $('sid').innerHTML=av.length?av.map(function(i){return '<option value="'+i.id+'">'+esc(label(i))+' (hay '+i.qty+')</option>'}).join(''):'<option value="">Sin resultados</option>'}
function togglePrice(){var r=val('cond')==='Recuperado';$('pbox').style.display=r?'none':'block';if($('rbox'))$('rbox').style.display=r?'block':'none'}
function drawFields(){
 var t=$('type').value,box=$('fields');
 box.innerHTML=(t==='Capacitor'?CAPHELP:t==='Potenciómetro'?PHELP:t==='Transistor'?PINHELP+SMDHELP+PKGHELP:(t==='Tiristor / Triac'||t==='Regulador de voltaje')?PINHELP:t==='Puente de diodos'?BRHELP:t==='Diodo'?DIODEHELP:'')+'<div class="row">'+TYPES[t].map(fieldHTML).join('')+'</div>';box.oninput=drawBands;box.onchange=function(e){if(e.target&&e.target.id==='f_Material')applyTol();if(e.target&&e.target.id==='f_Tipo')applyCol();drawBands()};applyTol();applyCol();drawBands()}
function form(k){
 var h='<h2>'+(k==='buy'?(window._rec?'♻️ Agregar recuperado':'🛒 Compra'):'💰 Venta')+'</h2><div class="card">';
 if(k==='buy'){
  h+='<label>Componente</label><select id="type" onchange="drawFields()">'+Object.keys(TYPES).map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><div id="fields"></div><div id="bands" class="card" style="margin-top:12px;text-align:center"></div><label>Estado</label><select id="cond" onchange="togglePrice()"><option>Nuevo</option><option>Recuperado</option></select><div id="rbox" style="display:none"><label>¿De dónde lo sacaste? (opcional)</label><input id="orig" type="text" placeholder="Ej: fuente de TV Samsung"><label>Estado de prueba</label><select id="test"><option value="">❓ Sin probar</option><option value="probado">✅ Probado (funciona)</option><option value="malo">❌ Malo</option></select></div>';
  if(S.cajas)h+='<div class="row"><div><label>Caja (opcional)</label><input id="box" type="text" placeholder="Ej: 3"></div><div><label>Cajón (opcional)</label><input id="drw" type="text" placeholder="Ej: 2"></div></div>';
  h+='<label>Cantidad</label><input id="qty" type="number" inputmode="numeric" min="1" placeholder="10"><div id="pbox"><label>Precio por unidad ($)</label><input id="price" type="number" step="any" inputmode="decimal" placeholder="50"></div>';
  h+='<button class="btn" onclick="buy()">Guardar compra</button>'}

function pad(n){return ('0000'+n).slice(-4)}
function newOrder(){draft={parts:[]};go('neword')}
function openOrd(n){cur=n;go('ordv')}
function ordList(){var h='<h2>🧾 Órdenes de trabajo</h2><button class="btn" style="margin:0 0 14px" onclick="newOrder()">➕ Nueva orden</button>',L=S.orders.slice().reverse();
 if(!L.length)return h+'<div class="empty">Aún no hay órdenes. Crea la primera.</div>';
 L.forEach(function(o){h+='<div class="card item" style="cursor:pointer" onclick="openOrd(\''+o.n+'\')"><div><b>Orden '+o.n+' · '+esc(o.cli)+'</b><small>'+esc(((o.marca||'')+' '+(o.modelo||'')).trim()||'Sin equipo')+' · '+esc(o.fecha)+'</small><small>Total '+money(o.total)+'</small></div><span class="badge '+(o.estado==='Entregado'?'b3':'b2')+'">'+o.estado+'</span></div>'});
 return h}
function fld(l,k,t,ph){var v=esc(draft[k]||'');
 if(t==='area')return '<label>'+l+'</label><textarea rows="2" oninput="draft.'+k+'=this.value">'+v+'</textarea>';
 return '<label>'+l+'</label><input type="'+(t||'text')+'" '+(t==='number'?'inputmode="decimal" step="any" oninput="draft.'+k+'=this.value;updTot()"':'oninput="draft.'+k+'=this.value"')+' value="'+v+'" placeholder="'+(ph||'')+'">'}
function partsTotal(){var t=0;draft.parts.forEach(function(p){t+=p.qty*p.price});return t}
function ordTotal(){return (parseFloat(draft.vd)||0)+(parseFloat(draft.vr)||0)+partsTotal()}
function updTot(){var t=$('tot');if(t)t.textContent=money(ordTotal())}
function avail(i){var u=0;draft.parts.forEach(function(p){if(p.id===i.id)u+=p.qty});return i.qty-u}
function fillPs(){var s=$('psid');if(!s)return;var q=val('psq'),av=S.items.filter(function(i){return avail(i)>0&&match(i,q)}).sort(cmpItems);
 s.innerHTML=av.length?av.map(function(i){return '<option value="'+i.id+'">'+esc(label(i))+' (hay '+avail(i)+')</option>'}).join(''):'<option value="">Sin resultados</option>'}
function addPart(){var it=find(val('psid')),q=num('pq'),p=num('pp')||0;
 if(!it)return say('Elige un repuesto del inventario');
 if(!q||q<1||q%1)return say('Escribe la cantidad (número entero)');
 if(q>avail(it))return say('Solo hay '+avail(it)+' disponibles');
 draft.parts.push({id:it.id,name:label(it),qty:q,price:p});render()}
function rmPart(ix){draft.parts.splice(ix,1);render()}
function ordForm(){
 var h='<h2>🧾 Nueva orden de trabajo</h2><div class="card">'+fld('Cliente *','cli')+'<div class="row"><div>'+fld('Teléfono','tel','tel')+'</div><div>'+fld('C.C.','cc')+'</div></div><div class="row"><div>'+fld('Marca','marca')+'</div><div>'+fld('Modelo','modelo')+'</div></div>'+fld('N° de serial del equipo','serial')+fld('Falla reportada por el cliente','falla','area')+fld('Diagnóstico técnico','diag','area')+fld('Reparación realizada','rep','area')+'</div>';
