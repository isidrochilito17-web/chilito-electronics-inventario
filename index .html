<style>

*{box-sizing:border-box}

'Buzzer':[['Tipo','sel',['Activo','Pasivo']],['Voltaje','sel',['3 V','5 V','12 V']]],
'Motor':[['Tipo','sel',['DC','Motorreductor','Motorreductor doble eje','Paso a paso','Servo','Ventilador','Driver de motor']],['Referencia','txt','opt'],['Voltaje','txt','opt']],
'Batería':[['Tipo','txt'],['Voltaje','txt','opt']],
'Pulsador':[['Tamaño','sel',['6x6 mm','12x12 mm','Industrial']]],

var ICON={Resistencia:'🔩',Capacitor:'🔋',LED:'💡',Diodo:'⚡',Transistor:'🔧',Integrado:'🧠',Potenciómetro:'🎛️',Interruptor:'🔘',Conector:'🔗',Otros:'📦','Módulo':'🧩',Sensor:'📡','Relé':'🔌',Microcontrolador:'🖥️','Regulador de voltaje':'🔋','Optoacoplador':'🔆','Tiristor / Triac':'⚡','Inductor / Bobina':'🌀',Transformador:'🧲',Fusible:'🧯',Cristal:'💎',Display:'📟',Buzzer:'🔔',Motor:'⚙️','Batería':'🔋',Pulsador:'🔘',Termistor:'🌡️','Zócalo':'🔲',Cable:'🪢'};
var S={items:[],moves:[]},view='home',msg=null,editId=null,act=null,bid=null;
try{var raw=localStorage.getItem('chilito_v1');if(raw){var p=JSON.parse(raw);if(p&&p.items&&p.moves)S=p}}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
 var h='<div style="text-align:center"><img src="'+LOGO+'" alt="Chilito Electronics" style="width:220px;max-width:70%;border-radius:12px;background:#fff"></div><p class="sub">Inventario de componentes electrónicos</p>';
 if(view==='home')h+=home()+tools();else if(view==='buy')h+=form('buy');else if(view==='sell')h+=form('sell');else if(view==='inv')h+=inv();else if(view==='low')h+=low();else if(view==='ord')h+=ordList();else if(view==='calc')h+=calcView();else if(view==='gan')h+=ganView();else if(view==='neword')h+=ordForm();else if(view==='ordv')h+=ordView();else h+=hist();
 $('app').innerHTML=h;
 var N=[['home','🏠','Inicio'],['inv','🗄️','Inventario'],['ord','🧾','Órdenes'],['hist','🕘','Historial']];
 $('nav').innerHTML=N.map(function(n){return '<button class="'+((view===n[0]||(n[0]==='ord'&&(view==='neword'||view==='ordv')))?'on':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('');
 if(view==='buy'){drawFields();togglePrice()}
 if(view==='sell'&&$('sid')){fillSel();toggleSell();drawCart()}
 if(view==='neword')fillPs();
}
function home(){
 var tot=0,by={};S.items.forEach(function(i){tot+=i.qty;var k=i.type==='Resistencia'&&i.f.Material?i.type+' · '+i.f.Material:i.type;by[k]=(by[k]||0)+i.qty});
 var spent=0,earn=0;S.moves.forEach(function(m){if(m.kind==='compra')spent+=m.qty*m.price;else earn+=m.qty*m.price});(S.orders||[]).forEach(function(o){earn+=(o.vd||0)+(o.vr||0)});
 var low=S.items.filter(function(i){return i.qty<=5}).length;
 var h='<button class="big buy" onclick="go(\'buy\')">🛒 COMPRA</button><div style="height:10px"></div><button class="big sell" onclick="go(\'sell\')">💰 VENTA</button><div style="height:16px"></div>';
 h+='<div class="card"><h2>📊 Resumen</h2><small style="color:var(--mu)">Toca un grupo para ver sus componentes</small><div class="grid"><div class="card stat"><b>'+tot+'</b><span>Componentes</span></div><div class="card stat"><b>'+S.items.length+'</b><span>Referencias</span></div>';
 Object.keys(by).sort().forEach(function(t){h+='<div class="card stat" style="cursor:pointer" onclick="openGroup(\''+t+'\')"><span>'+ICON[t.split(' · ')[0]]+' '+t+'</span><b>'+by[t]+'</b></div>'});
 h+='</div></div><div class="card"><div class="grid"><div class="stat"><span>Gastado</span><b class="c" style="font-size:20px">'+money(spent)+'</b></div><div class="stat"><span>Vendido</span><b class="v" style="font-size:20px">'+money(earn)+'</b></div></div></div>';
 h+='<div class="card"><b>🚨 Alertas</b><br>⚫ Agotado: 0 · 🔴 Muy pocos: 1–2 · 🟠 Pocos: 3–5 · 🟢 Bien: más de 5<br><b>'+low+' referencia(s) con stock bajo o agotado</b><button class="btn o" onclick="go(\'low\')">🚨 Ver alertas</button></div>';
 return h}
function fieldHTML(f){
 var id='f_'+f[0];
 if(f[1]==='sel')return '<div><label>'+f[0]+'</label><select id="'+id+'">'+f[2].map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select></div>';
 return '<div><label>'+f[0]+'</label><input id="'+id+'" '+(f[1]==='num'?'type="number" step="any" inputmode="decimal"':'type="text"')+' placeholder="'+(f[0]==='Nombre'?'Ej: Sensor de temperatura':'')+'"></div>'}
function norm(s){s=String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[µμ]/g,'u');
 s=s.replace(/(\d),(\d)/g,'$1.$2').replace(/kilo\s*ohm\w*/g,'k').replace(/micro\s*faradi\w*/g,'uf').replace(/nano\s*faradi\w*/g,'nf').replace(/pico\s*faradi\w*/g,'pf').replace(/ohm\w*|ω/g,'').replace(/[(),]/g,' ');
 s=s.replace(/(\d)\s+([a-z])/g,'$1$2');
 var w=s.split(/\s+/).filter(Boolean),x=[];
 w.forEach(function(a){if(/^\d[\d.]*(uf|nf|pf|uh|nh)$/.test(a))x.push(a.slice(0,-1))});
 return w.concat(x)}
function match(it,q){var qt=norm(q);if(!qt.length)return true;var w=norm(label(it)+' '+it.type);
 return qt.every(function(t){return w.some(function(a){return /\d/.test(t)?a===t:a.indexOf(t)===0})})}
function fillSel(){var q=val('sq'),av=S.items.filter(function(i){return i.qty>0&&match(i,q)}).sort(cmpItems);
 $('sid').innerHTML=av.length?av.map(function(i){return '<option value="'+i.id+'">'+esc(label(i))+' (hay '+i.qty+')</option>'}).join(''):'<option value="">Sin resultados</option>'}
function togglePrice(){var r=val('cond')==='Recuperado';$('pbox').style.display=r?'none':'block'}
function drawFields(){
 var t=$('type').value,box=$('fields');
 box.innerHTML=(t==='Capacitor'?CAPHELP:t==='Potenciómetro'?PHELP:(t==='Transistor'||t==='Tiristor / Triac'||t==='Regulador de voltaje')?PINHELP:'')+'<div class="row">'+TYPES[t].map(fieldHTML).join('')+'</div>';box.oninput=drawBands;box.onchange=function(e){if(e.target&&e.target.id==='f_Material')applyTol();if(e.target&&e.target.id==='f_Tipo')applyCol();drawBands()};applyTol();applyCol();drawBands()}
function form(k){
 var h='<h2>'+(k==='buy'?'🛒 Compra':'💰 Venta')+'</h2><div class="card">';
 if(k==='buy'){
  h+='<label>Componente</label><select id="type" onchange="drawFields()">'+Object.keys(TYPES).map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><div id="fields"></div><div id="bands" class="card" style="margin-top:12px;text-align:center"></div><label>Estado</label><select id="cond" onchange="togglePrice()"><option>Nuevo</option><option>Recuperado</option></select>';
  h+='<label>Cantidad</label><input id="qty" type="number" inputmode="numeric" min="1" placeholder="10"><div id="pbox"><label>Precio por unidad ($)</label><input id="price" type="number" step="any" inputmode="decimal" placeholder="50"></div>';
  h+='<button class="btn" onclick="buy()">Guardar compra</button>'}
 else{
  var av=S.items.filter(function(i){return i.qty>0});
  if(!av.length)return h+'<div class="empty">No hay componentes en inventario para vender. Registra una compra primero.</div></div>';
  h+='<label>Buscar (ej: 20k, relé)</label><input id="sq" oninput="fillSel()" placeholder="Buscar..."><label>Componente</label><select id="sid"></select>';
  h+='<label>Cantidad a vender</label><input id="qty" type="number" inputmode="numeric" min="1" placeholder="1"><label>Tipo de salida</label><select id="skind" onchange="toggleSell()"><option>Venta normal</option><option>Reparación</option><option>Prueba de laboratorio</option><option>Otro</option></select><div id="cbox"><label>Cliente (opcional)</label><input id="cli" type="text" placeholder="Nombre del cliente"></div><div id="fbox"><label>Serial de la factura</label><input id="fac" type="text" placeholder="Ej: 0042"></div><label>Descripción (opcional)</label><input id="desc" type="text" placeholder="Ej: Cambio de fuente de TV"><div id="spbox"><label>Precio de venta por unidad ($)</label><input id="price" type="number" step="any" inputmode="decimal" placeholder="100"></div>';
  h+='<div id="cartbox"></div><button class="btn" onclick="addCart()">➕ Agregar a la lista</button><button class="btn o" onclick="sell()">Guardar venta</button>'}
 h+='<div id="msg"></div></div>';return h}
function say(t,ok){$('msg').innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
function val(id){var e=$(id);return e?String(e.value==null?'':e.value).trim():''}
function num(id){var n=parseFloat(val(id));return isNaN(n)?null:n}
function buy(){var f0=$('photo')&&$('photo').files[0];if(!f0)return buy2(null);resize(f0,function(d){buy2(d)})}
function buy2(photo){
 var t=val('type'),f={},bad=null;
 TYPES[t].forEach(function(x){var v=val('f_'+x[0]);if((x[1]!=='sel')&&x[2]!=='opt'&&!v&&!bad)bad='Falta llenar: '+x[0];f[x[0]]=v});
 if(bad)return say(bad);
 var q=num('qty'),p=num('price');
 if(!q||q<1||q%1)return say('La cantidad debe ser un número entero mayor a 0');
 var rec=val('cond')==='Recuperado';if(rec)p=0;if(p==null||p<0)return say('Escribe el precio por unidad');
 var cond=rec?'Recuperado':'Nuevo',key=(rec?'R|':'')+t+'|'+JSON.stringify(f).toLowerCase(),it=S.items.filter(function(i){return i.key===key})[0];
 if(!it){it={id:Date.now()+'',key:key,type:t,cond:cond,f:f,qty:0,box:'',drw:'',price:0};S.items.push(it)}
 it.qty+=q;if(photo)it.photo=photo;it.price=p;if(val('box'))it.box=val('box');if(val('drw'))it.drw=val('drw');
 S.moves.unshift({d:new Date().toLocaleString('es-CO'),kind:'compra',id:it.id,name:label(it),qty:q,price:p});
 save();render();msg=1;$('msg').innerHTML='<div class="msg ok">✅ Compra guardada: '+q+' × '+esc(label(it))+'</div>'}
function sellOld(){
 var it=S.items.filter(function(i){return i.id===val('sid')})[0],q=num('qty'),p=num('price');
 if(!it)return say('Elige un componente');
 if(!q||q<1||q%1)return say('La cantidad debe ser un número entero mayor a 0');
 if(q>it.qty)return say('Solo hay '+it.qty+' en inventario');
 var k=val('skind'),paid=(k==='Venta normal'||k==='Reparación');if(!paid)p=0;if(p==null||p<0)return say('Escribe el precio de venta');
 it.qty-=q;
 S.moves.unshift({d:new Date().toLocaleString('es-CO'),kind:'venta',sub:k,cli:paid?val('cli'):'',fac:k==='Reparación'?val('fac'):'',desc:val('desc'),id:it.id,name:label(it),qty:q,price:p});
 save();render();$('msg').innerHTML='<div class="msg ok">✅ Venta guardada. Quedan '+it.qty+' de '+esc(label(it))+'</div>'}
function saveLoc(id){
 var it=S.items.filter(function(i){return i.id===id})[0];
 if(it){it.box=val('e_box');it.drw=val('e_drw');save()}
 editId=null;render()}
var DIG=[['Negro','#111'],['Marrón','#7b3f00'],['Rojo','#e53935'],['Naranja','#fb8c00'],['Amarillo','#fdd835'],['Verde','#43a047'],['Azul','#1e88e5'],['Violeta','#8e24aa'],['Gris','#9e9e9e'],['Blanco','#fff']],GOLD=['Dorado','#d4af37'],SILV=['Plata','#c0c0c0'];
function drawBands(){var b=$('bands');if(!b)return;if(val('type')==='Resistencia')return bandsInto(b,val('f_Material'),parseFloat(val('f_Valor')),val('f_Unidad'),val('f_Tolerancia'));var it={type:val('type'),f:{}};TYPES[it.type].forEach(function(x){it.f[x[0]]=val('f_'+x[0])});var pc=PICS?compPic(it,150):'';if(pc){b.style.display='block';b.innerHTML='<div style="display:flex;justify-content:center">'+pc+'</div>'}else b.style.display='none'}
function bandsInto(b,m,v,u,t){
 
 b.style.display='block';
 
 if(m==='SMD'||m==='Cerámica (potencia)'){b.innerHTML='<small>Estas resistencias traen el valor escrito, no usan bandas de colores</small>';return}
 if(isNaN(v)||v<=0){b.innerHTML='<small style="color:var(--mu)">Escribe el valor y aquí verás los colores de la resistencia.</small>';return}
 var ohms=v*({'Ω':1,'kΩ':1e3,'MΩ':1e6}[u]||1),nd=m==='Película metálica'?3:2;
 var e=Math.floor(Math.log10(ohms)+1e-9),x=e-(nd-1),d=Math.round(ohms/Math.pow(10,x));
 if(d>=Math.pow(10,nd)){d=Math.round(d/10);x++}
 if(x<-2||x>9||Math.abs(d*Math.pow(10,x)-ohms)/ohms>0.005){b.innerHTML='<small>Este valor no se puede mostrar exacto con '+(nd+2)+' bandas.</small>';return}
 var ds=String(d),seq=[],k;for(k=0;k<nd;k++)seq.push(DIG[+ds[k]]);
